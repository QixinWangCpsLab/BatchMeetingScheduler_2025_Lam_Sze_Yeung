{% extends "base.html" %}
{% block title %}Group Login{% endblock %}
{% block content %}
<section class="login-shell">
  <section class="card form-card login-card">
    <h2>Group Login</h2>
    <p class="meta">Use the meeting code plus your group credentials to submit preferences.</p>
    {% if msg %}<p class="notice">{{ msg }}</p>{% endif %}
    <form method="post" action="/group/login" class="form-grid one">
      <label>Meeting Code
        <input name="meeting_code" required placeholder="e.g. MG6B1M7XA" />
      </label>
      <label>Group Code
        <input name="group_code" required placeholder="e.g. G01" />
      </label>
      <label>Password
        <input type="password" name="password" required placeholder="e.g. g01pass" />
      </label>
      <button class="btn" type="submit">Enter Group Portal</button>
    </form>
  </section>
</section>
{% endblock %}
