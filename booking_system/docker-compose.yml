services:
  db:
    image: docker.m.daocloud.io/library/mysql:8.4
    container_name: reservation-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: reservation
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uappuser", "-papppass"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      args:
        PY_BASE_IMAGE: ${PY_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
    container_name: reservation-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://appuser:apppass@db:3306/reservation
      APP_SECRET: ${APP_SECRET:-change-me-in-production}
      BASE_URL: ${BASE_URL:-http://localhost}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-15}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    container_name: reservation-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  db_data:
